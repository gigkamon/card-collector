<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANJINGJING PHOTOCARD COLLECTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --primary-light: #fff1f2;
            --success: #10b981; 
            --warning: #f59e0b; 
            --danger: #ef4444; 
            --dark: #0f172a; 
            --text: #334155;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 24px 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .container { 
            background: var(--surface); 
            width: 100%; 
            max-width: 900px; 
            border-radius: var(--radius); 
            padding: 30px; 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border);
            margin-bottom: 24px; 
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h2 { color: var(--dark); margin-top: 0; text-align: center; font-weight: 800; font-size: 26px; letter-spacing: -0.5px; }
        .sub-title { text-align: center; font-size: 13px; color: #64748b; margin-top: -10px; margin-bottom: 25px; font-weight: 500; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; font-size: 13px; }
        
        input[type="text"], input[type="email"], input[type="password"] { 
            width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); 
            font-size: 14px; outline: none; transition: all 0.2s; background: #fff;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light);
        }

        .input-with-btn { display: flex; gap: 8px; }
        .input-with-btn input { flex: 1; }

        input[type="file"] { 
            width: 100%; padding: 12px; background: #f8fafc; border-radius: var(--radius-sm); 
            border: 2px dashed #cbd5e1; cursor: pointer; font-size: 13px;
        }
        
        button { 
            border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; 
            transition: all 0.2s; font-size: 14px; padding: 12px 20px; display: inline-flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        button:active { transform: scale(0.98); }
        
        .btn-block { width: 100%; margin-bottom: 12px; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
        .btn-success:hover { background: #059669; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: #ffffff; color: #475569; border: 1.5px solid var(--border); }
        .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
        .btn-select { background: #f1f5f9; color: var(--dark); border: 1.5px solid var(--border); padding: 0 16px; font-size: 13px; }
        .btn-select:hover { background: #e2e8f0; }

        .tools-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .search-input { width: 100%; padding: 12px 18px; border-radius: 30px; border: 1.5px solid var(--border); background: white; outline: none; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        
        .filter-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .filter-btn { padding: 8px 18px; border-radius: 30px; border: 1.5px solid var(--border); background: white; color: #64748b; font-size: 13px; font-weight: 600; }
        .filter-btn.active { background: var(--dark); color: white; border-color: var(--dark); }

        .collection-section { margin-bottom: 35px; width: 100%; }
        .collection-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 14px;
        }
        .collection-title { 
            color: var(--dark); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin: 0;
        }
        
        .btn-arrow-toggle {
            background: #f1f5f9; border: 1px solid var(--border); color: #475569;
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; font-size: 12px; padding: 0;
        }
        .btn-arrow-toggle:hover { background: #e2e8f0; color: var(--dark); transform: scale(1.1); }

        .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; }
        @media (min-width: 640px) { .template-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

        .card-item { 
            background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; 
            cursor: pointer; position: relative; display: flex; flex-direction: column; aspect-ratio: 2.5/3.5; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .card-item:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-color: #cbd5e1; z-index: 2; }
        
        .card-item.secret { border: 2px solid var(--warning); }
        .secret-badge { position: absolute; top: 0; right: 0; background: var(--warning); color: white; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 0 var(--radius-sm) 0 var(--radius-sm); z-index: 3; }
        
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        /* ซ่อนรูปภาพเมื่อเปิดใช้งาน */
        .card-item.hidden-img .card-img { filter: blur(16px) grayscale(100%); opacity: 0.1; }
        .card-item.hidden-img .card-mini-info { background: var(--dark); color: white; }

        .status-toggle { 
            position: absolute; top: 6px; left: 6px; font-size: 11px; width: 24px; height: 24px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; z-index: 3; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: 0.2s; backdrop-filter: blur(4px); 
        }
        .status-toggle:hover { transform: scale(1.15); }
        .owned .card-img { filter: grayscale(0%); opacity: 1; }
        .owned .status-toggle { background: rgba(16, 185, 129, 0.95); }
        .not-owned .card-img { filter: grayscale(100%); opacity: 0.3; }
        .not-owned .status-toggle { background: rgba(239, 68, 68, 0.9); }
        
        .card-mini-info { 
            position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(4px);
            padding: 5px; text-align: center; font-size: 11px; font-weight: 700; color: var(--dark); border-top: 1px solid var(--border); 
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 9999; padding: 20px; overflow-y: auto; }
        .modal-content { background: white; padding: 30px; border-radius: var(--radius); max-width: 100%; width: 420px; position: relative; margin: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .detail-label { color: #64748b; font-weight: 600; }
        .detail-value { color: var(--dark); text-align: right; font-weight: 700; }
        
        .app-section { display: none; width: 100%; max-width: 900px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--surface); padding: 16px 24px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }

        .picker-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 15px; margin-bottom: 20px; }
        .picker-item { padding: 10px 14px; background: #f8fafc; border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 13px; color: var(--dark); transition: 0.2s; text-align: left; }
        .picker-item:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

<div class="container" id="authSection" style="max-width: 400px; margin-top: 60px;">
    <h2>✨ PHOTOCARD VAULT</h2>
    <div class="sub-title" style="margin-bottom: 25px;">เข้าสู่ระบบเพื่อจัดการคอลเลกชันของคุณ</div>
    <div class="form-group"><input type="email" id="authEmail" placeholder="อีเมลของคุณ"></div>
    <div class="form-group"><input type="password" id="authPassword" placeholder="รหัสผ่าน"></div>
    <button class="btn-block btn-primary" onclick="handleAuth('login')">🚀 เข้าสู่ระบบ</button>
    <button class="btn-block btn-outline" onclick="handleAuth('register')">✨ สมัครสมาชิกใหม่</button>
</div>

<div id="mainAppSection" class="app-section">
    <div class="header-actions">
        <button onclick="renderAddForm()" class="btn-success" style="margin:0;">➕ เพิ่มการ์ดใหม่</button>
        <button onclick="handleLogout()" class="btn-outline" style="margin:0;">🚪 ออกจากระบบ</button>
    </div>
    <div class="container" id="appContent" style="background: var(--surface);"></div>
</div>

<!-- Modal ทั่วไป -->
<div id="modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="viewMode">
            <div style="background:#0f172a; border-radius:var(--radius-sm); padding:12px; display:flex; justify-content:center; margin-bottom: 20px;">
                <img id="m-img" src="" style="border-radius:6px; object-fit: cover; max-height: 280px; max-width: 100%;">
            </div>
            <div style="color:var(--primary); font-size:11px; font-weight:800; margin-bottom:4px;" id="m-col"></div>
            <div style="font-size:22px; font-weight:800; color:var(--dark); line-height: 1.2;" id="m-name"></div>
            <div style="font-size:13px; color:#64748b; margin-bottom:18px; font-weight:600;" id="m-num"></div>
            
            <div class="detail-row"><span class="detail-label">Event</span><span class="detail-value" id="m-event"></span></div>
            <div class="detail-row" style="border-bottom:none;"><span class="detail-label">Hashtag</span><span class="detail-value" id="m-hashtag"></span></div>
            
            <div style="display: flex; gap: 10px; margin-top: 25px;">
                <button onclick="toggleEditMode(true)" class="btn-block btn-warning" style="margin:0; flex:1;">✏️ แก้ไข</button>
                <button onclick="deleteCard()" class="btn-block btn-danger" style="margin:0; flex:1;">🗑️ ลบ</button>
            </div>
            <button onclick="closeModal()" class="btn-block btn-outline" style="margin-top:10px;">ปิดหน้าต่าง</button>
        </div>

        <div id="editMode" style="display:none;">
            <h3 style="margin-top:0; color: var(--dark); font-size: 20px;">✏️ แก้ไขข้อมูลการ์ด</h3>
            <form onsubmit="saveEditData(event)">
                <div class="form-group">
                    <label>📁 ชื่อคอลเลกชัน</label>
                    <div class="input-with-btn">
                        <input type="text" id="editColName" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required>
                        <button type="button" class="btn-select" onclick="openPicker('editColName', 'collection')">📌 เลือก</button>
                    </div>
                </div>
                
                <div style="display:flex; gap:12px;">
                    <div class="form-group" style="flex:1;"><label>หมายเลข</label><input type="text" id="editCardNum"></div>
                    <div class="form-group" style="flex:2;"><label>ชื่อการ์ด</label><input type="text" id="editCardName" required></div>
                </div>
                <div class="form-group">
                    <label>ชื่องาน (Event)</label>
                    <div class="input-with-btn">
                        <input type="text" id="editEvent" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
                        <button type="button" class="btn-select" onclick="openPicker('editEvent', 'event')">📌 เลือก</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>แฮชแท็ก</label>
                    <div class="input-with-btn">
                        <input type="text" id="editHashtag" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
                        <button type="button" class="btn-select" onclick="openPicker('editHashtag', 'hashtag')">📌 เลือก</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>📸 เปลี่ยนรูปใหม่ (เว้นว่างถ้าใช้รูปเดิม)</label>
                    <input type="file" id="editCardFile" accept="image/*">
                </div>
                
                <label style="display:flex; align-items:center; gap:8px; font-weight:700; color:var(--dark); cursor:pointer; margin: 15px 0; background: #fffbeb; padding: 10px; border-radius: var(--radius-sm); border: 1px solid #fef3c7;">
                    <input type="checkbox" id="editIsSecret" style="width:18px; height:18px; accent-color: var(--warning);"> 🌟 Secret Card
                </label>
                
                <div style="display:flex; gap:10px; margin-top: 20px;">
                    <button type="submit" class="btn-block btn-success" id="btnSaveEdit" style="margin:0; flex:1;">💾 บันทึก</button>
                    <button type="button" class="btn-block btn-outline" onclick="toggleEditMode(false)" style="margin:0; flex:1;">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Picker -->
<div id="pickerModal" class="modal-overlay" onclick="closePicker()" style="z-index: 10000;">
    <div class="modal-content" onclick="event.stopPropagation()" style="width: 360px;">
        <h3 id="pickerTitle" style="margin-top:0; font-size: 18px; color: var(--dark);">เลือกข้อมูล</h3>
        <div id="pickerContainer" class="picker-list"></div>
        <button onclick="closePicker()" class="btn-block btn-secondary" style="margin-top: 10px;">ปิด</button>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://qkkcgtniefzdxyrktbzj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFra2NndG5pZWZ6ZHh5cmt0YnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzA5MTEsImV4cCI6MjEwNjg0NjkxMX0.4mhliYG0SpTKqhWz4JkvukPRTupaxdMZZHodNCUTjtc";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null, myCards = [];
    let currentFilter = 'all', searchQuery = '';
    let currentCardId = null;
    let activeTargetInput = null;
    let hiddenCollections = {};

    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) { currentUser = session.user; toggleAuthView(true); loadData(); }
        else { toggleAuthView(false); }
    });

    supabase.auth.onAuthStateChange((event, session) => {
        if (session) { currentUser = session.user; toggleAuthView(true); loadData(); }
        else { currentUser = null; toggleAuthView(false); }
    });

    function toggleAuthView(isLoggedIn) {
        document.getElementById('authSection').style.display = isLoggedIn ? 'none' : 'block';
        document.getElementById('mainAppSection').style.display = isLoggedIn ? 'block' : 'none';
    }

    window.handleAuth = async (type) => {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        if(!email || !password) return alert('กรุณากรอกอีเมลและรหัสผ่าน');
        
        if(type === 'login') {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if(error) alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
        } else {
            const { error } = await supabase.auth.signUp({ email, password });
            if(error) alert("สมัครสมาชิกไม่สำเร็จ: " + error.message);
            else alert('✨ สมัครสมาชิกสำเร็จ!');
        }
    }

    window.handleLogout = () => supabase.auth.signOut();

    async function loadData() {
        if (!currentUser) return;
        const { data, error } = await supabase.from('my_cards').select('*').eq('user_id', currentUser.id);
        if (error) return;

        myCards = data.map(d => ({
            id: d.id, userId: d.user_id, collectionName: d.collection_name,
            cardName: d.card_name, cardNumber: d.card_number, event: d.event,
            hashtag: d.hashtag, isSecret: d.is_secret, imageUrl: d.image_url, isOwned: d.is_owned
        }));

        if(document.getElementById('inpColName')) return; 
        renderHome(); 
    }

    window.setFilter = (filter) => { currentFilter = filter; renderHome(); }
    window.setSearch = (val) => { searchQuery = val.toLowerCase(); renderHome(); }

    window.toggleHideCollection = (colName) => {
        hiddenCollections[colName] = !hiddenCollections[colName];
        renderHome();
    }

    window.renderHome = () => {
        const container = document.getElementById('appContent');
        const allColNames = [...new Set(myCards.map(c => c.collectionName))].sort(); 
        
        let html = `
            <h2 style="font-size: 22px; margin-bottom: 5px;">🌟 PHOTOCARD COLLECTION</h2>
            <div class="sub-title">ระบบจัดการการ์ดสะสมส่วนตัวของคุณ</div>
            
            <div class="tools-bar">
                <input type="text" class="search-input" placeholder="🔍 ค้นหาชื่อการ์ด หรือ หมายเลข..." value="${searchQuery}" onkeyup="setSearch(this.value)">
                <div class="filter-group">
                    <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">ทั้งหมด (${myCards.length})</button>
                    <button class="filter-btn ${currentFilter === 'owned' ? 'active' : ''}" onclick="setFilter('owned')">✅ มีแล้ว (${myCards.filter(c=>c.isOwned).length})</button>
                    <button class="filter-btn ${currentFilter === 'missing' ? 'active' : ''}" onclick="setFilter('missing')">❌ ยังขาด (${myCards.filter(c=>!c.isOwned).length})</button>
                </div>
            </div>
        `;

        if(allColNames.length === 0) {
            html += `<div style="text-align:center; padding:60px 20px; color:#94a3b8; font-weight:500;">ยังไม่มีข้อมูลการ์ด กดปุ่ม <b>"➕ เพิ่มการ์ดใหม่"</b> ด้านบนเพื่อเริ่มต้น</div>`;
        }

        allColNames.forEach(colName => {
            let cardsInCol = myCards.filter(c => c.collectionName === colName);
            cardsInCol = cardsInCol.filter(c => (c.cardName.toLowerCase().includes(searchQuery) || (c.cardNumber && c.cardNumber.toLowerCase().includes(searchQuery))));
            if (currentFilter === 'owned') cardsInCol = cardsInCol.filter(c => c.isOwned);
            if (currentFilter === 'missing') cardsInCol = cardsInCol.filter(c => !c.isOwned);
            cardsInCol.sort((a, b) => (parseInt(a.cardNumber) || 0) - (parseInt(b.cardNumber) || 0));

            if (cardsInCol.length > 0) {
                const ownedInCol = cardsInCol.filter(c => c.isOwned).length;
                const isHidden = hiddenCollections[colName] || false;
                
                html += `
                    <div class="collection-section">
                        <div class="collection-header">
                            <div class="collection-title">📁 ${colName} <span style="color:#64748b; font-weight:600; font-size: 13px;">(${ownedInCol}/${cardsInCol.length})</span></div>
                            <button class="btn-arrow-toggle" onclick="toggleHideCollection('${colName}')" title="${isHidden ? 'แสดงรูป' : 'ซ่อนรูป'}">
                                ${isHidden ? '🔽' : '🔼'}
                            </button>
                        </div>
                        <div class="template-grid">
                `;

                cardsInCol.forEach(c => {
                    const secretClass = c.isSecret ? 'secret' : '';
                    const secretBadge = c.isSecret ? `<div class="secret-badge">★ SECRET</div>` : '';
                    const hideClass = isHidden ? 'hidden-img' : '';
                    html += `
                        <div class="card-item ${c.isOwned ? 'owned' : 'not-owned'} ${secretClass} ${hideClass}" onclick="openModal('${c.id}')">
                            ${secretBadge}
                            <div class="status-toggle" onclick="toggleOwnership(event, '${c.id}', ${c.isOwned})">${c.isOwned ? '✓' : '!'}</div>
                            <img src="${c.imageUrl}" class="card-img" loading="lazy">
                            <div class="card-mini-info">${c.cardNumber ? `No. ${c.cardNumber}` : c.cardName}</div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
        });
        container.innerHTML = html;
    }

    window.renderAddForm = () => {
        document.getElementById('appContent').innerHTML = `
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                <h3 style="margin:0; font-size: 20px; color: var(--dark);">➕ เพิ่มการ์ดใหม่เข้าคอลเลกชัน</h3>
                <button class="btn-outline" onclick="renderHome()" style="padding: 8px 14px; font-size: 13px;">⬅ ย้อนกลับ</button>
            </div>
            <form onsubmit="saveData(event)">
                <div class="form-group">
                    <label>📁 ชื่อคอลเลกชัน</label>
                    <div class="input-with-btn">
                        <input type="text" id="inpColName" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" required placeholder="เช่น ALBUM 1">
                        <button type="button" class="btn-select" onclick="openPicker('inpColName', 'collection')">📌 เลือก</button>
                    </div>
                </div>
                
                <div style="display:flex; gap:12px;">
                    <div class="form-group" style="flex:1;"><label>🔢 หมายเลข</label><input type="text" id="inpCardNum" placeholder="01"></div>
                    <div class="form-group" style="flex:2;"><label>🃏 ชื่อการ์ด</label><input type="text" id="inpCardName" required placeholder="Ver. A"></div>
                </div>

                <div class="form-group">
                    <label>ชื่องาน (Event)</label>
                    <div class="input-with-btn">
                        <input type="text" id="inpEvent" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" placeholder="เช่น FANSIGN">
                        <button type="button" class="btn-select" onclick="openPicker('inpEvent', 'event')">📌 เลือก</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>แฮชแท็ก</label>
                    <div class="input-with-btn">
                        <input type="text" id="inpHashtag" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()" placeholder="#BENEFIT">
                        <button type="button" class="btn-select" onclick="openPicker('inpHashtag', 'hashtag')">📌 เลือก</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>📸 รูปภาพของการ์ด</label>
                    <input type="file" id="inpCardFile" accept="image/*" required>
                </div>
                
                <div style="background: #fffbeb; padding: 12px; border-radius: var(--radius-sm); border: 1px solid #fef3c7; margin: 15px 0;">
                    <label style="display:flex; align-items:center; gap:10px; font-weight:700; color:var(--dark); cursor:pointer; margin:0;">
                        <input type="checkbox" id="inpIsSecret" style="width:18px; height:18px; accent-color: var(--warning);"> 🌟 Secret Card (ขอบทอง)
                    </label>
                </div>

                <div style="background: #ecfdf5; padding: 12px; border-radius: var(--radius-sm); border: 1px solid #d1fae5; margin-bottom: 20px;">
                    <label style="display:flex; align-items:center; gap:10px; font-weight:700; color: var(--success); cursor:pointer; margin:0;">
                        <input type="checkbox" id="inpIsOwned" checked style="width:18px; height:18px; accent-color: var(--success);"> ✅ มีการ์ดใบนี้ครอบครองแล้ว
                    </label>
                </div>
                
                <button type="submit" class="btn-block btn-success" id="btnSave" style="padding: 14px;">📥 บันทึกข้อมูลการ์ด</button>
            </form>
        `;
    }

    window.openPicker = (inputId, type) => {
        activeTargetInput = inputId;
        const titleEl = document.getElementById('pickerTitle');
        const container = document.getElementById('pickerContainer');
        
        let items = [];
        if (type === 'collection') {
            titleEl.innerText = '📁 เลือกชื่อคอลเลกชัน';
            items = [...new Set(myCards.map(c => c.collectionName).filter(Boolean))].sort();
        } else if (type === 'event') {
            titleEl.innerText = '📅 เลือกชื่องาน (Event)';
            items = [...new Set(myCards.map(c => c.event).filter(Boolean))].sort();
        } else if (type === 'hashtag') {
            titleEl.innerText = '🏷️ เลือกแฮชแท็ก';
            items = [...new Set(myCards.map(c => c.hashtag).filter(Boolean))].sort();
        }

        if (items.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#94a3b8; font-size:13px;">ยังไม่มีประวัติข้อมูลส่วนนี้</div>`;
        } else {
            container.innerHTML = items.map(item => `
                <div class="picker-item" onclick="selectPickerItem('${item}')">${item}</div>
            `).join('');
        }

        document.getElementById('pickerModal').style.display = 'flex';
    }

    window.selectPickerItem = (val) => {
        if (activeTargetInput) { document.getElementById(activeTargetInput).value = val; }
        closePicker();
    }

    window.closePicker = () => { document.getElementById('pickerModal').style.display = 'none'; }

    window.saveData = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSave');
        btn.disabled = true; btn.innerText = '⏳ กำลังอัปโหลดและบันทึก...';

        try {
            const cardFile = document.getElementById('inpCardFile').files[0];
            const filePath = `${currentUser.id}/${Date.now()}_card`;
            const { error: uploadError } = await supabase.storage.from('cards').upload(filePath, cardFile);
            if (uploadError) throw uploadError;

            const { data: publicUrlData } = supabase.storage.from('cards').getPublicUrl(filePath);

            const { error: insertError } = await supabase.from('my_cards').insert([{
                user_id: currentUser.id,
                collection_name: document.getElementById('inpColName').value.trim().toUpperCase(),
                card_name: document.getElementById('inpCardName').value.trim(),
                card_number: document.getElementById('inpCardNum').value.trim(),
                event: document.getElementById('inpEvent').value.trim().toUpperCase(),
                hashtag: document.getElementById('inpHashtag').value.trim().toUpperCase(),
                is_secret: document.getElementById('inpIsSecret').checked,
                image_url: publicUrlData.publicUrl,
                is_owned: document.getElementById('inpIsOwned'].checked
            }]);

            if (insertError) throw insertError;

            alert('✅ บันทึกการ์ดสำเร็จ!');
            await loadData();
            renderHome();
        } catch (error) {
            alert('เกิดข้อผิดพลาด: ' + error.message);
        } finally { btn.disabled = false; btn.innerText = '📥 บันทึกข้อมูลการ์ด'; }
    }

    window.toggleOwnership = async (e, cardId, currentStatus) => {
        e.stopPropagation(); 
        const { error } = await supabase.from('my_cards').update({ is_owned: !currentStatus }).eq('id', cardId);
        if (!error) { await loadData(); renderHome(); }
    }

    window.openModal = (id) => {
        currentCardId = id;
        const c = myCards.find(x => x.id === id);
        if(!c) return;
        
        document.getElementById('m-img').src = c.imageUrl;
        document.getElementById('m-col').innerText = (c.collectionName || '').toUpperCase();
        document.getElementById('m-name').innerText = c.cardName;
        document.getElementById('m-num').innerText = c.cardNumber ? `No. ${c.cardNumber}` : '';
        document.getElementById('m-event').innerText = c.event || '-';
        document.getElementById('m-hashtag').innerText = c.hashtag || '-';

        toggleEditMode(false);
        document.getElementById('modal').style.display = 'flex';
    }
    
    window.closeModal = () => document.getElementById('modal').style.display = 'none';

    window.toggleEditMode = (isEdit) => {
        if(isEdit) {
            const c = myCards.find(x => x.id === currentCardId);
            document.getElementById('editColName').value = c.collectionName || '';
            document.getElementById('editCardNum').value = c.cardNumber || '';
            document.getElementById('editCardName').value = c.cardName || '';
            document.getElementById('editEvent').value = c.event || '';
            document.getElementById('editHashtag').value = c.hashtag || '';
            document.getElementById('editIsSecret').checked = c.isSecret || false;
            document.getElementById('editCardFile').value = '';
            
            document.getElementById('viewMode').style.display = 'none';
            document.getElementById('editMode').style.display = 'block';
        } else {
            document.getElementById('viewMode').style.display = 'block';
            document.getElementById('editMode').style.display = 'none';
        }
    }

    window.saveEditData = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSaveEdit');
        btn.disabled = true; btn.innerText = '⏳ กำลังบันทึก...';
        
        try {
            const editFile = document.getElementById('editCardFile').files[0];
            let updateData = {
                collection_name: document.getElementById('editColName').value.trim().toUpperCase(),
                card_number: document.getElementById('editCardNum').value.trim(),
                card_name: document.getElementById('editCardName').value.trim(),
                event: document.getElementById('editEvent').value.trim().toUpperCase(),
                hashtag: document.getElementById('editHashtag').value.trim().toUpperCase(),
                is_secret: document.getElementById('editIsSecret').checked
            };

            if (editFile) {
                const filePath = `${currentUser.id}/${Date.now()}_card`;
                const { error: uploadError } = await supabase.storage.from('cards').upload(filePath, editFile);
                if (uploadError) throw uploadError;
                const { data: publicUrlData } = supabase.storage.from('cards').getPublicUrl(filePath);
                updateData.image_url = publicUrlData.publicUrl;
            }

            const { error: updateError } = await supabase.from('my_cards').update(updateData).eq('id', currentCardId);
            if (updateError) throw updateError;
            
            alert('✅ อัปเดตข้อมูลสำเร็จ!');
            await loadData();
            closeModal();
            renderHome();
        } catch (err) { 
            alert('เกิดข้อผิดพลาด: ' + err.message); 
        } finally { 
            btn.disabled = false; btn.innerText = '💾 บันทึก'; 
        }
    }

    window.deleteCard = async () => {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบการ์ดใบนี้?')) {
            try { 
                const { error } = await supabase.from('my_cards').delete().eq('id', currentCardId);
                if (error) throw error;
                await loadData();
                closeModal(); 
                alert('🗑️ ลบสำเร็จ!'); 
                renderHome();
            } catch (err) { 
                alert('เกิดข้อผิดพลาด: ' + err.message); 
            }
        }
    }
</script>
</body>
</html>
